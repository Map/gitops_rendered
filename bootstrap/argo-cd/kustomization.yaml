apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - github.com/argoproj-labs/argocd-autopilot/manifests/base?ref=v0.4.19

configMapGenerator:
  - name: argocd-cm
    behavior: merge
    literals:
      ###################################################################
      # 1) repository.credentials must be valid YAML array. For example:
      ###################################################################
      - |-
        repository.credentials=|-
          - url: https://github.com/
            usernameSecret:
              name: autopilot-secret
              key: git_username
            passwordSecret:
              name: autopilot-secret
              key: git_token

      ###################################################################
      # 2) Simple single‐line key-value:
      ###################################################################
      - application.resourceTrackingMethod=annotation

      ###################################################################
      # 3) resource.exclusions must be valid YAML array:
      ###################################################################
      - |-
        resource.exclusions=|-
          - apiGroups:
              - "*"
            kinds:
              - ProviderConfigUsage

      ###################################################################
      # 4) resource.customizations must be a valid YAML map of
      #    “group/Kind pattern” -> ResourceOverride
      ###################################################################
      - |-
        resource.customizations=|-
          "*.upbound.io/*":
            health.lua: |
              health_status = {
                status = "Progressing",
                message = "Provisioning ..."
              }

              local function contains (table, val)
                for i, v in ipairs(table) do
                  if v == val then
                    return true
                  end
                end
                return false
              end

              local has_no_status = {
                "ProviderConfig",
                "ProviderConfigUsage"
              }

              if obj.status == nil or next(obj.status) == nil and contains(has_no_status, obj.kind) then
                health_status.status = "Healthy"
                health_status.message = "Resource is up-to-date."
                return health_status
              end

              if obj.status == nil or next(obj.status) == nil or obj.status.conditions == nil then
                if obj.kind == "ProviderConfig" and obj.status.users ~= nil then
                  health_status.status = "Healthy"
                  health_status.message = "Resource is in use."
                  return health_status
                end
                return health_status
              end

              for i, condition in ipairs(obj.status.conditions) do
                if condition.type == "LastAsyncOperation" and condition.status == "False" then
                  health_status.status = "Degraded"
                  health_status.message = condition.message
                  return health_status
                end

                if condition.type == "Synced" and condition.status == "False" then
                  health_status.status = "Degraded"
                  health_status.message = condition.message
                  return health_status
                end

                if condition.type == "Ready" and condition.status == "True" then
                  health_status.status = "Healthy"
                  health_status.message = "Resource is up-to-date."
                  return health_status
                end
              end

              return health_status

